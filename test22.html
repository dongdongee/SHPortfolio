<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const a = Number(prompt('숫자를 입력하세요',''));


        if ( 1 <= a >= 3 ){
            alert('봄입니다');
        } else if ( 4 <= a >= 6 ){
            alert('여름입니다');
        } else if ( 7 <= a >= 9 ){
            alert('가을입니다');
        } else{
            alert('겨울입니다');
        }

    </script>
</body>
</html>
