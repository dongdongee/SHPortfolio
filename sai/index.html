<!DOCTYPE html>
<html lang="ko" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAI Workspace | Sangho Portfolio</title>
    <!-- Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <!-- Pretendard -->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/reset.css">
    <link rel="stylesheet" href="/sai/assets/css/token.css">
    <link rel="stylesheet" href="/sai/assets/css/common.css">
    <link rel="stylesheet" href="/sai/assets/css/content.css">
</head>

<body>
    <div id="wrap">
        <div class="sai-header" data-include="./includes/header.html"></div>
        <div class="sai-layout">

            <div class="sai-aside" data-include="./includes/aside.html"></div>
                <main class="sai-content">
                    <section class="sai-kpi"></section>
                    <section class="sai-content-grid">
                        <article class="sai-content-card">
                            <div class="sai-content-card__header">
                                <div class="sai-chart__title-wrap">
                                    <h2 class="sai-chart__title">AI Requests</h2>
                                </div>
                                <select id="periodSelect" class="sai-select">
                                    <option value="daily">Daily</option>
                                    <option value="weekly">Weekly</option>
                                    <option value="monthly">Monthly</option>
                                </select>
                                <div class="sai-chart-value">
                                    <span id="requestTotal" class="sai-chart-value__total">0</span>
                                    <span id="requestChange" class="sai-chart-value__change"></span>
                                </div>
                            </div>
                            <div class="sai-content-card__body">
                                <canvas id="requestChart"></canvas>
                            </div>
                        </article>
                        <article class="sai-content-card">
                            <div class="sai-content-card__header">
                                <div class="sai-chart__title-wrap">
                                    <h2 class="sai-chart__title">
                                        AI Requests by Model
                                    </h2>
                                </div>
                                <select id="modelPeriodSelect" class="sai-select">
                                    <option value="7">7 Days</option>
                                    <option value="30">30 Days</option>
                                    <option value="90">90 Days</option>
                                </select>
                            </div>
                            <div class="sai-content-card__body">
                                <canvas id="modelChart"></canvas>
                            </div>
                        </article>
                    </section>
                    <section class="sai-content-grid">
                        <article class="sai-content-card">
                            <div class="sai-content-card__header">
                                <div class="sai-chart__title-wrap">
                                    <h2 class="sai-chart__title">Resent Projects</h2>
                                </div>
                                <a href="javascript:;" role="button" class="sai-link__button">View All</a>
                            </div>
                            <div class="sai-content-card__body">
                                <ul class="sai-project-list">
                                    <li class="sai-project-list__item">
                                        <a href="javascript:;" class="sai-project-list__link">
                                            <span class="sai-project-list__icon">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-file-invoice">
                                                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                                    <path d="M14 3v4a1 1 0 0 0 1 1h4" />
                                                    <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2" />
                                                    <path d="M9 7l1 0" />
                                                    <path d="M9 13l6 0" />
                                                    <path d="M13 17l2 0" />
                                                </svg>
                                            </span>

                                            <span class="sai-recent-projects__info">
                                                <strong>SAI Marketing Website</strong>
                                                <span>Web Project</span>
                                            </span>

                                            <span class="sai-recent-projects__members">
                                                <button class="sai-header__user-info" type="button" aria-label="사용자 메뉴" >
                                                    <span class="sai-header__user-text">S</span>
                                                </button>
                                            </span>

                                            <span class="sai-recent-projects__date">
                                                2d ago
                                            </span>

                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </article>
                        <article class="sai-content-card">
                            <div class="sai-content-card__header">
                                <div class="sai-chart__title-wrap">
                                    <h2 class="sai-chart__title">
                                        AI Requests by Model
                                    </h2>
                                </div>
                                <a href="#" role="button" class="sai-link__button">View All</a>
                            </div>
                            <div class="sai-chart__body">
                                <canvas id="modelChart"></canvas>
                            </div>
                        </article>
                    </section>
                </main>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="/assets/js/include.js"></script>
    <script defer src="/sai/assets/js/common.js"></script>
    <script defer src="/sai/assets/js/chart.js"></script>


</body>

</html>
