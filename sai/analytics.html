<!DOCTYPE html>
<html lang="ko" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAI Workspace | Sangho Portfolio</title>
    <!-- Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <!-- Pretendard -->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- CSS -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" href="/assets/css/reset.css">
    <link rel="stylesheet" href="/sai/assets/css/token.css">
    <link rel="stylesheet" href="/sai/assets/css/common.css">
    <link rel="stylesheet" href="/sai/assets/css/content.css">
</head>

<body>
    <div id="wrap">
        <div class="sai-layout">
            <div class="sai-aside" data-include="./includes/aside.html"></div>
            
                <main class="sai-content">
                    <div class="sai-content__panel">
                        <div class="sai-breadcrumb">
                            <span class="sai-breadcrumb__home">
                                <span class="sai-button__ico sai-nav__ico">
                                    <svg class="sai-icon" aria-hidden="true">
                                        <use href="/sai/assets/images/svg_ico.svg#ico_home"></use>
                                    </svg>
                                </span>
                            </span>
                            <span class="sai-breadcrumb__arrow">
                                <span class="sai-button__ico sai-nav__ico">
                                    <svg class="sai-icon" aria-hidden="true">
                                        <use href="/sai/assets/images/svg_ico.svg#ico_chevron_right"></use>
                                    </svg>
                                </span>
                            </span>
                            <span class="sai-breadcrumb__text">Dashboard</span>
                            <span class="sai-breadcrumb__arrow">
                                <span class="sai-button__ico sai-nav__ico">
                                    <svg class="sai-icon" aria-hidden="true">
                                        <use href="/sai/assets/images/svg_ico.svg#ico_chevron_right"></use>
                                    </svg>
                                </span>
                            </span>
                            <span class="sai-breadcrumb__text">Analytics</span>
                            <span class="sai-breadcrumb__arrow">
                                <span class="sai-button__ico sai-nav__ico">
                                    <svg class="sai-icon" aria-hidden="true">
                                        <use href="/sai/assets/images/svg_ico.svg#ico_chevron_right"></use>
                                    </svg>
                                </span>
                            </span>
                            <span class="sai-breadcrumb__text">Usage</span>
                        </div>
                        <div class="sai-tab">
                            <ul class="sai-tab__wrap">
                                <li class="sai-tab__item is-active">
                                    <a href="javascript;">
                                        <span>Usage</span>
                                    </a>
                                </li>
                                <li class="sai-tab__item">
                                    <a href="javascript;">
                                        <span>Models</span>
                                    </a>
                                </li>
                                <li class="sai-tab__item">
                                    <a href="javascript;">
                                        <span>Users</span>
                                    </a>
                                </li>
                                <li class="sai-tab__item">
                                    <a href="javascript;">
                                        <span>Projects</span>
                                    </a>
                                </li>
                                <li class="sai-tab__item">
                                    <a href="javascript;">
                                        <span>Cost</span>
                                    </a>
                                </li>
                                <li class="sai-tab__item">
                                    <a href="javascript;">
                                        <span>API Logs</span>
                                    </a>
                                </li>
                            </ul>
                        </div>
                        <div class="sai-datepicker">
                            <div class="sai-datepicker__box">
                                <span class="sai-datepicker__label">조회 기준일</span>
                                <input type="text" class="sai-datepicker__date" tabindex="-1" aria-hidden="true" >
                                <button type="button" class="sai-datepicker__trigger" aria-labelledby="sai-datepicker__label analytics-date-text">
                                    <span class="sai-datepicker__text"></span>
                                </button>
                            </div>
                            <div class="sai-datepicker__box">
                                <span class="sai-datepicker__label">조회 기간</span>
                                <p class="sai-datepicker__period" aria-live="polite"></p>
                                <p class="sai-datepicker__info">선택한 날짜를 포함한 최근 7일간의 데이터입니다.</p>
                            </div>
                        </div>
                        <section class="sai-content-grid sai-content-grid--kpi">
                            <article class="kpi-card" data-chart="mini" data-source="usage" data-metric="requests" data-color="purple">
                                <div class="kpi-card__body">
                                    <div class="kpi-card__mark">
                                        <span class="sai-mark sai-mark--lg sai-mark--purple sai-mark--square">
                                            <span class="sai-button__ico sai-nav__ico">
                                                <svg class="sai-icon" aria-hidden="true">
                                                    <use href="/sai/assets/images/svg_ico.svg#ico_user"></use>
                                                </svg>
                                            </span>
                                        </span>
                                    </div>
                                    <div class="kpi-card__box">
                                        <div class="kpi-card__content">
                                            <span class="kpi-card__label">Total Request</span>
                                            <strong class="kpi-card__value"></strong>
                                            <div class="kpi-card__meta">
                                                <span class="kpi-card__change"></span>
                                                <span class="kpi-card__compare">vs last 7 days</span>
                                            </div>
                                        </div>
                                        <div class="kpi-card__chart">
                                            <canvas></canvas>
                                        </div>
                                    </div>
                                </div>
                            </article>
                            <article class="kpi-card" data-chart="mini" data-source="usage" data-metric="tokens" data-color="blue">
                                <div class="kpi-card__body">
                                    <div class="kpi-card__mark">
                                        <span class="sai-mark sai-mark--lg sai-mark--blue sai-mark--square">
                                            <span class="sai-button__ico sai-nav__ico">
                                                <svg class="sai-icon" aria-hidden="true">
                                                    <use href="/sai/assets/images/svg_ico.svg#ico_request"></use>
                                                </svg>
                                            </span>
                                        </span>
                                    </div>
                                    <div class="kpi-card__box">
                                        <div class="kpi-card__content">
                                            <span class="kpi-card__label">Total Tokens</span>
                                            <strong class="kpi-card__value"></strong>
                                            <div class="kpi-card__meta">
                                                <span class="kpi-card__change"></span>
                                                <span class="kpi-card__compare">vs last 7 days</span>
                                            </div>
                                        </div>
                                        <div class="kpi-card__chart">
                                            <canvas></canvas>
                                        </div>
                                    </div>
                                </div>
                            </article>
                            <article class="kpi-card" data-chart="mini" data-source="usage" data-metric="responseTime" data-color="orange">
                                <div class="kpi-card__body">
                                    <div class="kpi-card__mark">
                                        <span class="sai-mark sai-mark--lg sai-mark--orange sai-mark--square">
                                            <span class="sai-button__ico sai-nav__ico">
                                                <svg class="sai-icon" aria-hidden="true">
                                                    <use href="/sai/assets/images/svg_ico.svg#ico_project"></use>
                                                </svg>
                                            </span>
                                        </span>
                                    </div>
                                    <div class="kpi-card__box">
                                        <div class="kpi-card__content">
                                            <span class="kpi-card__label">Response Time</span>
                                            <strong class="kpi-card__value"></strong>
                                            <div class="kpi-card__meta">
                                                <span class="kpi-card__change"></span>
                                                <span class="kpi-card__compare">vs last 7 days</span>
                                            </div>
                                        </div>
                                        <div class="kpi-card__chart">
                                            <canvas></canvas>
                                        </div>
                                    </div>
                                </div>
                            </article>
                            <article class="kpi-card" data-chart="mini" data-source="usage" data-metric="successRate" data-color="green">
                                <div class="kpi-card__body">
                                    <div class="kpi-card__mark">
                                        <span class="sai-mark sai-mark--lg sai-mark--green sai-mark--square">
                                            <span class="sai-button__ico sai-nav__ico">
                                                <svg class="sai-icon" aria-hidden="true">
                                                    <use href="/sai/assets/images/svg_ico.svg#ico_status"></use>
                                                </svg>
                                            </span>
                                        </span>
                                    </div>
                                    <div class="kpi-card__box">
                                        <div class="kpi-card__content">
                                            <span class="kpi-card__label">Success Rate</span>
                                            <strong class="kpi-card__value"></strong>
                                            <div class="kpi-card__meta">
                                                <span class="kpi-card__change"></span>
                                                <span class="kpi-card__compare">vs last 7 days</span>
                                            </div>
                                        </div>
                                        <div class="kpi-card__chart">
                                            <canvas></canvas>
                                        </div>
                                    </div>
                                </div>
                            </article>
                        </section>
                        <section class="sai-content-grid sai-content-grid--6-4 ">
                            <article class="sai-content-card js-analytics-usage-trend">
                                <div class="sai-content__body sai-content__body--padding sai-content__body--progress">
                                    <div class="sai-card__title sai-card__title--flex">
                                        <span class="sai-nav__ico sai-ico__title">
                                            <svg class="sai-icon" aria-hidden="true">
                                                <use href="/sai/assets/images/svg_ico.svg#ico_overview"></use>
                                            </svg>
                                        </span>
                                        <h2 class="sai-card__title-text">Requests & Tokens Trend</h2>
                                    </div>
                                    <div class="sai-card__content">
                                        <div class="sai-chart sai-chart--line">
                                            <canvas></canvas>
                                        </div>
                                    </div>
                                </div>
                            </article>
                            <article class="sai-content-card js-analytics-usage-model">
                                <div class="sai-content__body sai-content__body--padding sai-content__body--progress">
                                    <div class="sai-card__title sai-card__title--flex">
                                        <span class="sai-nav__ico sai-ico__title">
                                            <svg class="sai-icon" aria-hidden="true">
                                                <use href="/sai/assets/images/svg_ico.svg#ico_overview"></use>
                                            </svg>
                                        </span>
                                        <h2 class="sai-card__title-text">Requests & Tokens Trend</h2>
                                    </div>
                                    <div class="sai-card__content">
                                        <div class="sai-chart sai-chart--doughnut">
                                            <canvas></canvas>
                                        </div>
                                        <ul class="sai-chart-legend js-usage-model-legend"></ul>
                                    </div>
                                </div>
                            </article>
                        </section>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script defer src="/assets/js/include.js"></script>
    <script defer src="/sai/assets/js/common.js"></script>
    <script defer src="/sai/assets/js/chart.js"></script>
    <script defer src="/sai/assets/js/analytics.js"></script>


</body>
