<header class="sai-header">
    <div class="sai-header__inner">

        <h1 class="sai-header__logo">
            <a href="/sai/" class="sai-header__logo-link">
                <img class="sai-header__logo-image" src="/assets/svg/ico_logo.svg" alt="">
                <span class="sai-header__logo-text">SAI Workspace</span>
            </a>
        </h1>

        <div class="sai-header__util">

            <div class="sai-header__credit">
                <span class="sai-header__credit-symbol"></span>
                <span class="sai-header__credit-value">12,480</span>
            </div>

            <div class="sai-header__theme js-theme-toggle">
                <button class="sai-header__button sai-header__button--light js-theme-button" type="button" data-theme-value="light" aria-label="라이트 모드로 전환" >
                    <span class="sai-header__button-ico"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-sun-low"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M4 12h.01" /><path d="M12 4v.01" /><path d="M20 12h.01" /><path d="M12 20v.01" /><path d="M6.31 6.31l-.01 -.01" /><path d="M17.71 6.31l-.01 -.01" /><path d="M17.7 17.7l.01 .01" /><path d="M6.3 17.7l.01 .01" /></svg></span>
                    <span class="blind">Light Mode</span>
                </button>

                <button class="sai-button sai-header__button--dark js-theme-button" type="button" data-theme-value="dark" aria-label="다크 모드로 전환" >
                    <span class="sai-button__ico">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-moon-stars"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454l0 .008" /><path d="M17 4a2 2 0 0 0 2 2a2 2 0 0 0 -2 2a2 2 0 0 0 -2 -2a2 2 0 0 0 2 -2" /><path d="M19 11h2m-1 -1v2" /></svg>
                    </span>
                    <span class="blind">Dark Mode</span>
                </button>
            </div>

            <button class="sai-button sai-header__button--setting" type="button" aria-label="설정" >
                <span class="sai-button__ico">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-settings"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065" /><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /></svg>
                </span>
                <span class="blind">settings</span>
            </button>

            <button class="sai-header__user-info" type="button" aria-label="사용자 메뉴" >
                <div class="sai-mark sai-mark--purple">
                    <span>S</span>
                </div>
            </button>

        </div>
    </div>
</header>
